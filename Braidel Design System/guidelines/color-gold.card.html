<!-- @dsCard group="Colors" viewport="700x150" name="Secondary — Deep Gold" subtitle="Secondary accent ramp · --gold-*" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:20px;font-family:var(--font-mono)}
  .ramp{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .sw{height:74px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:7px;
      box-shadow:var(--shadow-xs);border:1px solid rgba(0,0,0,.05)}
  .sw span{font-size:10px;font-weight:600;background:rgba(255,255,255,.82);padding:1px 4px;border-radius:4px;color:#3a2a1e}
  .sw.dk span{background:rgba(0,0,0,.28);color:#fff}
  .cap{margin-top:8px;font-size:11px;color:var(--text-muted)}
</style></head>
<body>
<div class="ramp">
  <div class="sw" style="background:var(--gold-50)"><span>50</span></div>
  <div class="sw" style="background:var(--gold-100)"><span>100</span></div>
  <div class="sw" style="background:var(--gold-200)"><span>200</span></div>
  <div class="sw" style="background:var(--gold-300)"><span>300</span></div>
  <div class="sw dk" style="background:var(--gold-400)"><span>400</span></div>
  <div class="sw dk" style="background:var(--gold-500)"><span>500</span></div>
  <div class="sw dk" style="background:var(--gold-600)"><span>600</span></div>
  <div class="sw dk" style="background:var(--gold-700)"><span>700</span></div>
</div>
<div class="cap">Secondary actions, ratings &amp; "top rated" accents. <b>--secondary = --gold-500 (#C2922F)</b>. Use sparingly beside terracotta.</div>
</body></html>
