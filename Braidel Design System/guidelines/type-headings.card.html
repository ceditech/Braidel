<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:22px;color:var(--text-strong)}
  .r{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px solid var(--border-subtle)}
  .r:last-child{border:none}
  .t{font-family:var(--font-display);font-weight:700;letter-spacing:var(--tracking-snug);line-height:1.1}
  .k{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle);margin-left:auto;white-space:nowrap}
  .h1{font-size:38px}.h2{font-size:30px}.h3{font-size:23px}.h4{font-size:21px;font-weight:600}.h5{font-size:18px;font-weight:600}
</style></head>
<body>
  <div class="r"><span class="t h1">Find skilled braiders</span><span class="k">H1 · 700</span></div>
  <div class="r"><span class="t h2">Open opportunities</span><span class="k">H2 · 700</span></div>
  <div class="r"><span class="t h3">Manage applicants</span><span class="k">H3 · 700</span></div>
  <div class="r"><span class="t h4">Portfolio highlights</span><span class="k">H4 · 600</span></div>
  <div class="r"><span class="t h5">Availability this week</span><span class="k">H5 · 600</span></div>
</body></html>
