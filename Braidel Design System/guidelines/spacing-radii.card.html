<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="From controls to feature panels · --radius-*" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:22px;font-family:var(--font-mono);color:var(--text-muted)}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .item{display:flex;flex-direction:column;align-items:center;gap:7px}
  .box{width:84px;height:62px;background:var(--surface-card);border:1.5px solid var(--brand);
       box-shadow:var(--shadow-sm)}
  .n{font-size:10.5px}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="n">xs · 6</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n">sm · 10</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="n">md · 14</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="n">lg · 20</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="n">xl · 28</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="n">pill</span></div>
</div>
<div style="margin-top:12px;font-size:11px">Controls <b>md</b> · cards <b>lg</b> · feature panels <b>xl</b> · chips &amp; avatars <b>pill</b>.</div>
</body></html>
