<!-- @dsCard group="Brand" viewport="700x180" name="The braid mark" subtitle="Two interwoven strands — connection & craft" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);padding:24px;font-family:var(--font-sans);color:var(--text-muted)}
  .row{display:flex;gap:20px;align-items:center}
  .tile{width:96px;height:96px;border-radius:var(--radius-lg);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
  .cream{background:var(--surface-card);border:1px solid var(--border-subtle)}
  .terra{background:var(--terracotta-50)}
  .dark{background:var(--charcoal-900)}
  .app{background:var(--brand);border-radius:22px}
  .note{font-size:12.5px;line-height:1.55;max-width:320px}
  .note b{color:var(--text-strong)}
</style></head>
<body>
<div class="row">
  <div class="tile cream"><img src="../assets/braidel-mark.svg" width="52" height="52" alt=""></div>
  <div class="tile terra"><img src="../assets/braidel-mark.svg" width="52" height="52" alt=""></div>
  <div class="tile dark"><img src="../assets/braidel-mark.svg" width="52" height="52" alt=""></div>
  <div class="note">Two strands of <b>terracotta</b> and <b>gold</b> braid together — the meeting of salons and braiders. Keep clear space ≥ half the mark's width; never recolor the strands or rotate the mark.</div>
</div>
</body></html>
