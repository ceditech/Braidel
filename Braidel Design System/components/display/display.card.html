<!-- @dsCard group="Components" viewport="700x430" name="Cards, Badges, Avatars & Rating" subtitle="Card, CardMedia, Badge, Tag, Avatar, Rating" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{ margin:0; background:var(--bg-page); padding:28px; font-family:var(--font-sans); color:var(--text-body); }
  .wrap{ display:flex; flex-direction:column; gap:22px; }
  .row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .ph{ aspect-ratio:4/3; background:
        radial-gradient(circle at 30% 30%, var(--cream-200), var(--sand-300));
        display:grid; place-items:center; }
  .ph svg{ opacity:.5 }
  .lbl{ font-family:var(--font-mono); font-size:11px; letter-spacing:var(--tracking-eyebrow);
        text-transform:uppercase; color:var(--text-subtle); margin-bottom:8px; }
  .name{ font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text-strong); }
  .meta{ font-size:13px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { Card, CardBody, Badge, Tag, Avatar, AvatarGroup, Rating } = window.BraidelDesignSystem_a13fae;
const Mark = () => <svg width="40" height="40" viewBox="0 0 48 48" fill="none"><path d="M15 6C15 15 33 17 33 24 33 31 15 33 15 42" stroke="#8B6B50" strokeWidth="5.2" strokeLinecap="round"/><path d="M33 6C33 15 15 17 15 24 15 31 33 33 33 42" stroke="#BCA384" strokeWidth="5.2" strokeLinecap="round"/></svg>;
const braiders = [
  { n:'Amara Okafor', c:'Atlanta, GA', s:'Knotless', r:4.9, rev:128, badge:'Verified' },
  { n:'Tasha Bell', c:'Houston, TX', s:'Box braids', r:4.8, rev:96, badge:'Top rated' },
  { n:'Lina Mensah', c:'Newark, NJ', s:'Locs', r:5.0, rev:54, badge:'New' },
];
function Demo(){
  return (
    <div className="wrap">
      <div>
        <div className="lbl">Badges</div>
        <div className="row">
          <Badge variant="success" dot>Matched</Badge>
          <Badge variant="warning">Pending</Badge>
          <Badge variant="danger">Closed</Badge>
          <Badge variant="brand">Verified</Badge>
          <Badge variant="gold">Top rated</Badge>
          <Badge variant="neutral">Part-time</Badge>
        </div>
      </div>
      <div>
        <div className="lbl">Tags · Avatars · Rating</div>
        <div className="row">
          <Tag selected>Knotless</Tag><Tag>Cornrows</Tag><Tag onRemove={()=>{}}>Locs</Tag>
          <AvatarGroup><Avatar name="Amara O" size="sm"/><Avatar name="Tasha B" size="sm"/><Avatar name="Lina M" size="sm"/></AvatarGroup>
          <Avatar name="Amara O" size="sm" status="online"/>
          <Rating value={4.9} count={128}/>
        </div>
      </div>
      <div>
        <div className="lbl">Braider cards</div>
        <div className="cards">
          {braiders.map(b => (
            <Card key={b.n} interactive>
              <div className="ph"><Mark/></div>
              <CardBody>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span className="name">{b.n}</span>
                  <Badge variant={b.badge==='New'?'gold':'brand'}>{b.badge}</Badge>
                </div>
                <span className="meta">{b.c} · {b.s} specialist</span>
                <Rating value={b.r} count={b.rev} size="0.95rem"/>
              </CardBody>
            </Card>
          ))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
