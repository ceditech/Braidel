<!-- @dsCard group="Components" viewport="700x200" name="Tabs" subtitle="Tabs — underline & pill, with count badges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{ margin:0; background:var(--bg-page); padding:28px; font-family:var(--font-sans); color:var(--text-body); }
  .wrap{ display:flex; flex-direction:column; gap:22px; }
  .row{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .col{ display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { Tabs } = window.BraidelDesignSystem_a13fae;
function Demo(){
  const [t,setT] = React.useState('all');
  const [p,setP] = React.useState('work');
  return (
    <div className="wrap">
      <div className="col">
        <Tabs value={t} onChange={setT} items={[
          {value:'all',label:'All applicants',count:12},
          {value:'new',label:'New',count:3},
          {value:'short',label:'Shortlisted'},
        ]}/>
        <Tabs variant="pill" value={p} onChange={setP} items={[
          {value:'work',label:'Portfolio'},
          {value:'about',label:'About'},
          {value:'reviews',label:'Reviews'},
        ]}/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
