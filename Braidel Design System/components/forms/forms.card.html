<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{ margin:0; background:var(--bg-page); padding:28px; font-family:var(--font-sans); color:var(--text-body); }
  .wrap{ display:flex; flex-direction:column; gap:22px; max-width:640px; }
  .row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .lbl{ font-family:var(--font-mono); font-size:11px; letter-spacing:var(--tracking-eyebrow);
        text-transform:uppercase; color:var(--text-subtle); margin-bottom:2px; }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { Button, Input, Select, Checkbox, Switch } = window.BraidelDesignSystem_a13fae;
function Demo(){
  return (
    <div className="wrap">
      <div>
        <div className="lbl">Button — variants</div>
        <div className="row">
          <Button variant="primary">Book now</Button>
          <Button variant="secondary">Apply</Button>
          <Button variant="outline">Message</Button>
          <Button variant="ghost">Cancel</Button>
          <Button variant="danger">Withdraw</Button>
        </div>
      </div>
      <div>
        <div className="lbl">Sizes &amp; states</div>
        <div className="row">
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <Button loading>Saving</Button>
          <Button disabled>Disabled</Button>
          <Button pill variant="secondary">Pill</Button>
        </div>
      </div>
      <div className="grid2">
        <Input label="Full name" placeholder="Amara Okafor" />
        <Select label="Specialty" options={['Knotless','Box braids','Locs','Cornrows']} />
      </div>
      <Input label="City" error="Please choose a city." placeholder="Atlanta, GA" />
      <div className="row" style={{gap:'24px'}}>
        <Checkbox label="Knotless braids" defaultChecked />
        <Checkbox radio name="r" label="I'm a braider" defaultChecked />
        <Switch label="Available for work" defaultChecked />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
