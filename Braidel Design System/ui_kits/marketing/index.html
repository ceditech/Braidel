<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braidel — Marketing</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body{ margin:0; background:var(--bg-page); color:var(--text-body); font-family:var(--font-sans); }
  a{ text-decoration:none; }
  #root{ min-height:100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react" src="../shared/Icon.jsx"></script>
<script type="text/babel" data-presets="react" src="chrome.jsx"></script>
<script type="text/babel" data-presets="react" src="Landing.jsx"></script>
<script type="text/babel" data-presets="react" src="FindBraiders.jsx"></script>
<script type="text/babel" data-presets="react" src="BraiderProfile.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [route, setRoute] = React.useState('landing');
  const go = (r) => {
    if (r === 'app') { window.location.href = '../app/index.html'; return; }
    setRoute(r); window.scrollTo(0, 0);
  };
  const { Nav, Footer } = window;
  const isList = route === 'braiders' || route === 'salons' || route === 'jobs';
  return (
    <div>
      <Nav go={go} active={route} />
      {route === 'landing' && <window.Landing go={go} />}
      {isList && <window.FindBraiders go={go} />}
      {route === 'braider' && <window.BraiderProfile go={go} />}
      <Footer go={go} />
    </div>
  );
}
function mount(){
  if (!window.Landing || !window.Nav || !window.BraidelDesignSystem_a13fae) { setTimeout(mount, 40); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
mount();
</script>
</body>
</html>
