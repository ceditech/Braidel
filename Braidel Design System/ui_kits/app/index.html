<!-- @dsCard group="App" viewport="1340x860" name="App — Dashboard" subtitle="Salon & braider dashboards, applicants, messaging (role switch + click through)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braidel — App</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body{ margin:0; background:var(--bg-page); color:var(--text-body); font-family:var(--font-sans); }
  a{ text-decoration:none; }
  .app{ display:flex; min-height:100vh; }
  .main{ flex:1; min-width:0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react" src="../shared/Icon.jsx"></script>
<script type="text/babel" data-presets="react" src="shell.jsx"></script>
<script type="text/babel" data-presets="react" src="Dashboards.jsx"></script>
<script type="text/babel" data-presets="react" src="Messages.jsx"></script>
<script type="text/babel" data-presets="react" src="SalonScreens.jsx"></script>
<script type="text/babel" data-presets="react" src="BraiderScreens.jsx"></script>
<script type="text/babel" data-presets="react">
const TITLES = {
  salon: { dash: ['Welcome back, Crown & Coils', 'Here\u2019s what\u2019s happening today'], posts: ['Post an opportunity', 'Reach braiders near you'],
           applicants: ['Applicants', 'Review and shortlist braiders'], messages: ['', ''], settings: ['Settings', 'Manage your salon account'] },
  braider:{ dash: ['Welcome back, Amara', 'New work near you'], posts: ['Find work', '24 opportunities within 10 miles'],
           applicants: ['Your applications', 'Track where you stand'], messages: ['', ''], settings: ['Settings', 'Manage your braider account'] },
};
function Settings({ role }) {
  const { Card, Input, Switch, Button, Select, Avatar } = window.BraidelDesignSystem_a13fae;
  return (
    <div style={{ padding: 32, maxWidth: 720, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 20 }}>
      <Card padded>
        <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 19, margin: '0 0 18px' }}>Profile</h3>
        <div style={{ display: 'flex', gap: 18, alignItems: 'center', marginBottom: 20 }}>
          <Avatar name={role === 'salon' ? 'Crown Coils' : 'Amara Okafor'} size="xl" ring />
          <Button variant="outline" size="sm">Change photo</Button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
          <Input label={role === 'salon' ? 'Salon name' : 'Full name'} defaultValue={role === 'salon' ? 'Crown & Coils' : 'Amara Okafor'} />
          <Input label="City" defaultValue="Atlanta, GA" />
        </div>
      </Card>
      <Card padded>
        <h3 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 19, margin: '0 0 18px' }}>Notifications</h3>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>New {role === 'salon' ? 'applicants' : 'matching jobs'}</span><Switch defaultChecked /></div>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Messages</span><Switch defaultChecked /></div>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Weekly digest email</span><Switch /></div>
          {role === 'braider' && <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Available for work</span><Switch defaultChecked /></div>}
        </div>
      </Card>
    </div>
  );
}

function App(){
  const [role, setRole] = React.useState('salon');
  const [route, setRoute] = React.useState('dash');
  const go = (r) => { setRoute(r); window.scrollTo(0, 0); };
  const { Sidebar, Topbar } = window;
  const { Button } = window.BraidelDesignSystem_a13fae;
  const Icon = window.Icon;
  const [title, sub] = (TITLES[role][route] || ['', '']);
  let screen, action = null;
  if (route === 'dash') screen = role === 'salon' ? <window.SalonDashboard go={go} /> : <window.BraiderDashboard go={go} />;
  else if (route === 'messages') screen = <window.Messages role={role} />;
  else if (route === 'posts') { screen = role === 'salon' ? <window.PostOpportunity go={go} /> : <window.FindWork go={go} />; }
  else if (route === 'applicants') { screen = role === 'salon' ? <window.ManageApplicants go={go} /> : <window.Applications />; if (role==='salon') action = <Button onClick={()=>go('posts')} iconLeft={<Icon name="plus" size={17}/>}>Post opportunity</Button>; }
  else if (route === 'settings') screen = <Settings role={role} />;
  const setRoleReset = (r) => { setRole(r); setRoute('dash'); };
  return (
    <div className="app">
      <Sidebar role={role} route={route} go={go} setRole={setRoleReset} />
      <div className="main">
        {route !== 'messages' && <Topbar title={title} sub={sub} action={action} />}
        {screen}
      </div>
    </div>
  );
}
function mount(){
  if (!window.SalonDashboard || !window.Sidebar || !window.BraidelDesignSystem_a13fae) { setTimeout(mount, 40); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
mount();
</script>
</body>
</html>
